name: Windows scanner checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Run collector and analyze real inventory
        shell: powershell
        run: |
          python -c "import analysis; p=analysis.run_scan(print); d=analysis.load_scan(p); assert analysis.process_findings(d); assert d['Meta']['Coverage']; assert analysis.analyze(d); assert 'Network' in d; d['Meta']['Coverage']={k: 'Complete' for k in d['Meta']['Coverage']}; d['Meta']['Coverage']['Scheduled tasks']='Partial (test)'; retry=analysis.load_scan(analysis.run_scan(prior=d)); assert retry['Meta']['RetriedSections']==['Scheduled tasks']; assert retry['Network']==d['Network']"
      - name: Explain a synthetic finding with local Ollama
        shell: powershell
        env:
          SCANNER_OLLAMA_MODEL: smollm2:135m
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ollama.zip'
          curl.exe --fail --location --retry 2 https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip -o $zip
          if ($LASTEXITCODE) { throw 'Ollama download failed' }
          $folder = Join-Path $env:RUNNER_TEMP 'ollama-test'
          Expand-Archive $zip $folder
          $exe = (Get-ChildItem $folder -Recurse -Filter ollama.exe | Select-Object -First 1).FullName
          $server = Start-Process $exe -ArgumentList 'serve' -PassThru
          try {
            for ($attempt=0; $attempt -lt 30; $attempt++) {
              try { Invoke-RestMethod http://127.0.0.1:11434/api/tags | Out-Null; break } catch { Start-Sleep 1 }
            }
            & $exe pull $env:SCANNER_OLLAMA_MODEL
            if ($LASTEXITCODE) { throw 'Test model unavailable' }
            python -c "from analysis import Finding; from finding_ai import explain_finding; model, text = explain_finding(Finding('Medium','Task','CI',reasons=['Signature unknown'])); assert text.strip()"
            if ($LASTEXITCODE) { throw 'Local explanation failed' }
          } finally {
            if (!$server.HasExited) { $server.Kill() }
          }
      - name: Package scanner
        shell: powershell
        run: |
          Compress-Archive -Path *.py,*.bat,README.md,user-guide.html,engine,assets -DestinationPath system-scanner.zip
      - uses: actions/upload-artifact@v4
        with:
          name: system-scanner-windows
          path: system-scanner.zip
